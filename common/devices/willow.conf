# Redmi Note 8T -- port in progress (see docs/PORTING.md).
NAME="Redmi Note 8T (willow)"
KIND=phone                      # phone | qemu
SOC="Qualcomm Snapdragon 665 (SM6125, trinket)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# Mu-Silicium already has willowPkg; its memory map and Resources/Configs/willow.toml give these values.
UEFI_TARGET=willow
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/... or prebuilt/uefi
# willow's ABL hangs on Mu-Silicium's own image (header v1, the merged willow.dtb with board-id 0x22
# appended, text_offset = FD_BASE) before running a single instruction of it; it runs one packed like
# the phone's own boot.img: header v2, the stock dtb section (board-id 0, ABL overlays dtbo on it),
# text_offset 0x80000. The dtb section comes out of the phone's boot partition (never in git):
#   adb pull /dev/block/by-name/boot boot.img, then cut out its dtb section (header v2, see mkbootimg)
BOOT_HEADER=2
TEXT_OFFSET=0x80000
DTB=$HOME/willow/stock-dtbs/stock-dtb-section.bin
FD_BASE=0x5FC00000              # willowPkg MemoryMapLib: "UEFI FD"
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # TODO: check it is free in the memory map the UEFI prints on the phone (RAM 0x40000000-0x140000000)

# --- kernel and loader -----------------------------------------------------------------------------
# The UEFI's free RAM (diagnostics report, 2026-10-24): 0x60000000-0x7DD00000 (477 MB),
# 0x80000000-0xF0000000 (1792 MB, the largest: XNU's window), 0xF4000000-0x140000000 (1216 MB).
# The loader's default base 0xA1000000 would split the largest one: put it in the first.
LOADER_BASE=0x61000000
# xnuloader/loader.c: platform_willow (two clusters: cores 0-3 MPIDR 0x0-0x3, 4-7 MPIDR 0x100-0x103)
FB_BASE=0x5C000000              # willowPkg MemoryMapLib: "Display Reserved", 1080 x 2340
WIFI_ATH11K=0                   # WCN3990-class radio, not ath11k

# --- what the run needs ----------------------------------------------------------------------------
# First runs: one core, no touch (the Novatek NT36672A has no driver yet), framebuffer only.
BOOTARGS="cpus=1"
DEFAULT_SECS=300
USERLAND_VARS=""
FIRMWARE=""
